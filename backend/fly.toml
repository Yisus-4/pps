# fly.toml app configuration file generated for backend-wispy-current-9096 on 2026-10-16T08:53:17-03:00
#
# See https://fly.io/docs/reference/configuration/ for information about how to use this file.
#

app = 'backend-wispy-current-9096'
primary_region = 'gru'

[env]
  DATABASE_URL = "sqlite:////data/alumnos.db"

[mounts]
  source = 'alumnos_data'
  destination = '/data'

[build]

[http_service]
  internal_port = 8000
  force_https = true
  auto_stop_machines = 'stop'
  auto_start_machines = true
  min_machines_running = 0
  processes = ['app']

[[vm]]
  memory = '1gb'
  cpu_kind = 'shared'
  cpus = 1
  memory_mb = 1024
